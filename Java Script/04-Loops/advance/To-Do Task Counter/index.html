<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="to-do">
      <div class="all_count">
        <h1>TO-DO TASK COUNTER</h1>
        <div class="to-do-count">
          <!-- box1 -->
          <div class="count count1">
            <h3>1. Enter Number of Tasks</h3>

            <label for="input">How many task do you want to add?</label>
            <input type="number" id="input" class="input1" />

            <!-- 
          change its class to btn later -->
            <button id="startBtn" class="btn1">Start</button>
          </div>

          <!-- box2 -->
          <div class="count count2">
            <h3>Enter Tasks</h3>
            <p>Task 1 of 5</p>
            <label for="task">Enter task name</label>
            <input type="text" id="task" class="input1" />

            <button class="btn btn1" id="addTaskbtn">Add Task</button>
            <label for="task__list">Task List</label>
            <input type="text" id="task_list" class="input1" />
          </div>

          <!-- box3 -->
          <div class="count count3">
            <div class="content3">
              <h3>Mark as Completed</h3>
            </div>

            <div class="buttons3">
              <button class="btn1 yes_btn">✓ Yes,Completed</button>

              <button class="btn1 no_btn">✗ No, Not Yet</button>

              <button class="btn btn1 next_btn" id="btn">
                Next Task &rarr;
              </button>
            </div>
          </div>

          <!-- box4 -->
          <!-- box4 -->
          <div class="count count4">
            <h3>Progress</h3>

            <div class="row">
              <p>Total Tasks</p>
              <span class="badge blue">5</span>
            </div>

            <div class="row">
              <p>Completed Tasks</p>
              <span class="badge green">3</span>
            </div>

            <div class="row">
              <p>Pending Tasks</p>
              <span class="badge orange">2</span>
            </div>

            <!-- Progress section -->
            <p class="progress-title">Progress</p>

            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>

            <p class="progress-text">3 / 5 completed</p>
          </div>
        </div>
        <!-- box5 -->

        <div class="count count5">
          <div class="content">
            <h3>All tasks added!</h3>
          </div>
          <div class="buttons">
            <button id="total_task" class="btn btn1">Total Tasks:</button>
            <button id="completed_task" class="btn btn1">Completed:</button>
            <button class="btn btn1" id="pending_task">Pending:</button>
            <button class="btn btn1" id="exit">Exit</button>
          </div>
        </div>
      </div>
    </section>

    <!-- java script file -->
    <script src="script.js"></script>
  </body>
</html>
