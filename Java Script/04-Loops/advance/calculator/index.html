<!-- Q1: Simple Calculator 
Menu system:
1. Add
2. Subtract
3. Multiply
4. Exit
Keep running until user chooses Exit -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div id="calculator">
        <h2>Calculator</h2>

        <input type="number" id="input" placeholder="enter value" />

        <div class="buttons">
          <button id="add">Add</button>
          <button id="sub">Subtract</button>
          <button id="mult">Multiply</button>
          <button id="exit">Exit</button>
        </div>
      </div>

      <p id="result"></p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
