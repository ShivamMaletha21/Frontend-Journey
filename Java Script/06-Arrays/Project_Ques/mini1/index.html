<!-- Smart Expense Tracker
A JavaScript-based expense tracking application that allows users to manage and analyze their daily expenses.
Features: 
Add expenses with category and amount
View all recorded expenses
Filter expenses by category (Food, Travel, Shopping, etc.)
Find high-value expenses
Calculate total spending
Format and display expense data dynamically
Delete specific expenses -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- style sheet -->
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>

  <!-- body -->
  <body>
    <!-- Main BOX -->
    <div class="container">
      <div class="header">
        <h1>🧾 SMART EXPENSE TRACKER</h1>
        <p>Track your daily spending smartly</p>
        <span id="headline"></span>
      </div>

      <!-- Dashboard-->
      <!-- Dashboard-->
      <div class="dashboard">
        <div class="card">
          <div class="card-title">
            <h4>Total Spending</h4>
            <span class="tag total">TOTAL</span>
          </div>
          <p id="total_spend">$0</p>
        </div>

        <div class="card highlight">
          <div class="card-title">
            <h4>Biggest Expense</h4>
            <span class="tag big">HIGH</span>
          </div>
          <p id="big_expense">$0</p>
        </div>

        <div class="card">
          <div class="card-title">
            <h4>Expense This Month</h4>
            <span class="tag month">MONTH</span>
          </div>
          <p id="monthly_expense">0</p>
        </div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <!-- left side -->
        <div class="left">
          <div class="box">
            <h3>ADD EXPENSE</h3>

            <!-- (input) -->
            <div class="form">
              <select name="category" id="category">
                <option value="Food">Food</option>
                <option value="Shopping">Shopping</option>
                <option value="Travel">Travel</option>
                <option value="Utilities">Utilities</option>
                <option value="Bills">Bills</option>
              </select>
              <!-- amount -->
              <input type="text" id="amount" placeholder="enter amount" />
              <!-- button -->
              <button id="box2_btn">+ Add Expense</button>
            </div>
          </div>

          <!-- EXPENSE LIST -->
          <div class="box">
            <h3>EXPENSE LIST</h3>

            <div class="table-header">
              <div>Date</div>
              <div>Category</div>
              <div>Amount</div>
              <div>Action</div>
            </div>

            <!-- JS Code come here -->
            <div id="expenseList" class="expense-list"></div>
          </div>

          <!-- left close -->
        </div>

        <!-- RIGHT SIDE -->
        <div class="right">
          <div class="box">
            <h3>Analytics</h3>

            <select id="filter">
              <option value="all" selected>All Categories</option>
              <option value="food">Food</option>
              <option value="travel">Travel</option>
              <option value="shopping">Shopping</option>
              <option value="bills">Bills</option>
            </select>

            <button class="big-btn" id="bigExpenseBtn">
              Find Big Expense (> 5000)
            </button>

            <!-- REPLACED CHART -->
            <div id="analyticsBox" class="analytics-box"></div>
          </div>
        </div>

        <!-- Main ends here -->
      </div>

      <!-- Main Box ends here -->
    </div>

    <!-- java script -->
    <script src="script.js"></script>
  </body>
</html>
