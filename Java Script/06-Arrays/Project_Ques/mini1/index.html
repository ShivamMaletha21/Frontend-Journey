<!-- Project 1: Smart Expense Tracker 
Idea
A system where users add expenses and analyze spending.
Features
1. Add Expense
Category (Food, Travel, Shopping, etc.)
Amount
Add to array using push()
2. Show All Expenses
Display list using forEach()
3. Filter Expenses
Show only Food / Travel / Shopping
Use filter()
4. Find Big Expense
Find first expense > 5000
Use find()
5. Total Spending
Use reduce()
6. Convert Display Format
Example:
Food - 500
Travel - 1000
Use map() or forEach()
7. Delete Expense
Remove last or specific expense
Use pop() / splice() -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/fea7f68681.js"
      crossorigin="anonymous"
    ></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="boxes">
      <h1>
        <i class="fa-solid fa-money-bills"></i>
        SMART EXPENSE TRACKER
      </h1>

      <h4>Summary Dashboard</h4>

      <!-- SUMMARY -->
      <div class="box box1">
        <p class="box1_content" id="total_spend">Total Spending:</p>

        <p class="box1_content" id="big_expense">Biggest Expense:</p>

        <p class="box1_content" id="monthly_expense">Expenses This Month:</p>
      </div>

      <!-- ADD EXPENSE -->
      <div class="box box2">
        <h4>Add New Expense</h4>

        <div class="box2_category">
          <label for="category">Category:</label>

          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
          </select>
        </div>

        <div class="box2_amount">
          <h4>Amount</h4>

          <input type="number" id="amount" placeholder="500" />
        </div>

        <div class="box2_button">
          <button id="box2_btn">+ ADD EXPENSE</button>
        </div>
      </div>

      <!-- EXPENSE LIST -->
      <div class="box">
        <h3>Expense List</h3>

        <div id="expenseList">
          <!-- JavaScript will generate rows here -->
        </div>
      </div>

      <!-- Future Box -->
      <div class="box"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
