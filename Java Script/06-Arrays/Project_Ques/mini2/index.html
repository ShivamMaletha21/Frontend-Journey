<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="header">
        <h1>💼 SMART EXPENSE TRACKER</h1>
        <p>Track your daily spending smartly</p>
      </div>

      <!-- SUMMARY -->
      <div class="summary">
        <div class="card">
          <h4>Total Spending</h4>
          <p id="total_spend">₹0</p>
        </div>

        <div class="card highlight">
          <h4>Biggest Expense</h4>
          <p id="big_expense">₹0</p>
        </div>

        <div class="card">
          <h4>Expenses This Month</h4>
          <p id="monthly_expense">0</p>
        </div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <!-- LEFT SIDE -->
        <div class="left">
          <!-- ADD EXPENSE BOX -->
          <div class="box">
            <h3>Add New Expense</h3>

            <div class="form">
              <select id="category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
              </select>

              <input type="number" id="amount" placeholder="Enter Amount" />

              <button id="box2_btn">+ Add Expense</button>
            </div>
          </div>

          <!-- EXPENSE LIST -->
          <div class="box">
            <h3>Expense List</h3>

            <div class="table-header">
              <div>Date</div>
              <div>Category</div>
              <div>Amount</div>
              <div>Action</div>
            </div>

            <!-- JS WILL RENDER HERE -->
            <div id="expenseList" class="expense-list"></div>
          </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right">
          <!-- ANALYTICS (PLACEHOLDER ONLY) -->
          <div class="box">
            <h3>Analytics</h3>

            <select>
              <option disabled selected>All Categories</option>
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Bills</option>
            </select>

            <button class="big-btn">Find Big Expense (&gt; 5000)</button>

            <div class="chart">📊 Chart Area (JS/Chart.js later)</div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
