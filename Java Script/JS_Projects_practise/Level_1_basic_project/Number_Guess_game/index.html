<!-- V2 adds 5 things:

Maximum attempts
Remaining attempts
Guess history
Input validation
Prevent duplicate guesses -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Number Guessing Game 🎯</h1>
    <div class="game-container">
      <!-- select game levles -->
      <select name="game" id="game_levels">
        <option value="Select">Game Levels</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="difficult">Difficult</option>
      </select>

      <!-- giving input -->
      <label for="num">Guess Number</label>
      <input type="number" id="num" placeholder="Enter number" />

      <!-- showing input -->
      <p id="show_input">Show Result</p>
      <p id="show_attempts">Remaining Attempts</p>
      <p id="guess"></p>
      <p id="show_level"></p>
      <p id="hint"></p>
      <p id="best_score"></p>

      <button id="check">Click to Check</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
