<!-- Q1.Create a shopping cart function that accepts unlimited item prices and returns the total bill. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Shopping Cart</h1>

      <input type="text" id="price" placeholder="Enter Item Price" />

      <button id="totalBtn">Calculate Total</button>

      <h2 id="result">Total Bill: ₹0</h2>
    </div>

    <script src="script.js"></script>
  </body>
</html>
