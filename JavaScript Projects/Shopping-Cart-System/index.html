<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- fontawesome -->
    <script
      src="https://kit.fontawesome.com/fea7f68681.js"
      crossorigin="anonymous"
    ></script>

    <!-- css -->
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- HOME SECTION -->
    <section class="home">
      <!-- MAIN SECTION (HOLDS EVERY DIVS) -->
      <div class="main">
        <!-- NABVAR -->
        <div class="navbar">
          <!-- logo -->
          <div class="logo">
            <img src="images/logo/logo.png" alt="company_logo" width="50px" />
            <p>ShopEase</p>
          </div>
          <!-- TAGS -->
          <div class="tags">
            <ul>
              <li><a href="#">Home</a></li>
              <li><a href="#">Shop</a></li>
              <li><a href="#">Categories</a></li>
              <li><a href="#">Deals</a></li>
            </ul>
          </div>
          <!-- SEARCHBAR -->
          <div class="searchbar">
            <input
              type="text"
              id="search-product"
              placeholder="Search Products..."
            />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <!-- RIGHTSIDE CART -->
          <div class="cart">
            <div class="cart-logo">
              <i class="fa-solid fa-cart-flatbed-suitcase"></i>
              <p>Cart</p>
            </div>

            <div class="cart-logo">
              <p><i class="fa-solid fa-user"></i></p>
            </div>
          </div>
        </div>

        <div class="hero-section">
          <div class="content">
            <h1>Smart Shopping Experience</h1>
            <p>Manage your Cart Effortlessly</p>
          </div>
          <div class="buttons">
            <button class="button button1">Start Shopping</button>
            <button class="button button2">View Cart</button>
          </div>
        </div>

        <div class="featured_products">
            
        </div>
      </div>
    </section>
  </body>
</html>
