<!-- Intermediate Level (Flex + Animations + Responsive)
Split Hero with Video Background
Left: Text + CTA button
Right: Short muted looping video instead of image
Responsive: Stack text above video on mobile -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Productivity Hero</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h1>
          Boost Your <span class="highlight">Productivity</span> with
          Intelligent Automation
        </h1>

        <p>
          Simplify your workflow, manage tasks faster, and automate repetitive
          work with our next-generation AI-powered productivity platform.
        </p>

        <div class="buttons">
          <button class="primary-btn">Start Free Trial</button>
          <button class="secondary-btn">Watch Demo</button>
        </div>
      </div>

      <div class="hero-video">
        <video autoplay muted loop playsinline>
          <source
            src="images/7252682-hd_1920_1080_25fps.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
  </body>
</html>
