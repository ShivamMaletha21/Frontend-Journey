<!-- Q5. em Confusion Test 
Nested elements (parent → child → grandchild)
Task:
Use em for font-size
Observe:
How size keeps increasing -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="parent">
      <h1>Parent</h1>
      <div id="child">
        <h2>Box1</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam, nemo!
          Esse totam repellendus quia similique eum magnam iure. Rerum,
          perspiciatis!
        </p>
        <div id="grandchild">
          <h2>Box2</h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit saepe
            aperiam error, ad est quas cum et asperiores officia sit?
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
