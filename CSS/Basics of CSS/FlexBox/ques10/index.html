<!-- 10) Product Card Row
Create an e-commerce section with 4 product cards in one row.
Each card should have:
image
title
price
buy button
Use gap and spacing properly. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <h1 id="heading">Featured Products</h1>
    </div>
    <section class="cards">
      <div class="card">
        <img
          src="images/headphone.jpg"
          alt="Wireless Headphones"
          width="250px"
        />
        <h3>Wireless Headphones</h3>
        <p>Price: ₹1,999</p>
        <button>Buy Now</button>
      </div>

      <div class="card">
        <img src="images/watch.webp" alt="Smart Watch" width="250px" />
        <h3>Smart Watch</h3>
        <p>Price: ₹2,499</p>
        <button>Buy Now</button>
      </div>

      <div class="card">
        <img src="images/shoes.jpg" alt="Running Shoes" width="250px" />
        <h3>Running Shoes</h3>
        <p>Price: ₹3,299</p>
        <button>Buy Now</button>
      </div>

      <div class="card">
        <img src="images/bag.jpg" alt="Laptop Backpack" width="250px" />
        <h3>Laptop Backpack</h3>
        <p>Price: ₹1,999</p>
        <button>Buy Now</button>
      </div>
    </section>
  </body>
</html>
