<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h1>Unleash Your Creativity Today</h1>
        <p>
          Join thousands of creators and bring your ideas to life with our
          easy-to-use tools.
        </p>
        <div class="buttons">
          <button>Get Started</button>
          <button class="secondary">Learn More</button>
        </div>
        <a class="contact" href="mailto:your@email.com">Contact Us</a>
        <ul class="features">
          <li>Fast & intuitive interface</li>
          <li>24/7 support & community help</li>
          <li>Templates & resources for every project</li>
          <li>Works on all devices</li>
        </ul>
      </div>
      <div class="hero-image">
        <img
          src="images/photo-1773332585698-cba3c91b73e4.avif"
          alt="Creative workspace"
        />
      </div>
    </section>
  </body>
</html>
