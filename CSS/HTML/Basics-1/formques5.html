<!-- LEVEL 3: Advanced Real-World Forms

5. Signup Form (Professional Level)
Like Facebook / Instagram signup
Requirements:
First Name + Last Name
Email (required)
Password (required, min 6 chars using pattern)
Confirm Password (just UI, no JS yet)
Gender (radio)
Date of Birth (date)
Terms & Conditions (checkbox required)
Sign Up button -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#" method="post">
      <!-- First Name  -->

      <label for="First">First Name</label>
      <br />
      <input
        type="text"
        name="First"
        id="First"
        placeholder="enter your first name"
        required
      />
      <br />
      <br />

      <!-- Last Name -->
      <label for="last">Last Name</label>
      <br />
      <input
        type="text"
        name="last"
        id="last"
        placeholder="enter your last name"
        required
      />
      <br />
      <br />

      <!-- Email (required) -->
      <label for="email">Email</label>
      <br />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="enter your email"
        required
      />
      <br />
      <br />
      <!-- Password (required, min 6 chars using pattern) -->
      <label for="password1">Password require 6 char</label>
      <br />
      <input
        type="text"
        name="password"
        id="password1"
        pattern="[0-9]{6}"
        required
      />
      <br />
      <br />

      <!-- Confirm Password (just UI, no JS yet) -->
      <label for="password2">Enter your password</label> <br />
      <input type="password" id="password2" name="password" required />
      <br />
      <br />

      <label for="confirm_password">Confirm your Password</label>
      <br />
      <input type="password" id="confirm_password" name="password" required />
      <br />
      <br />

      <!-- Gender (radio) -->
      <label for="radio">Gender</label> <br />
      <input type="radio" name="radio" value="Male" required />Male
      <input type="radio" name="radio" value="Female" required />Female
      <input type="radio" name="radio" value="Others" required />Others <br />
      <br />

      <!-- Date of Birth (date) -->
      <label for="dob">Your DOB</label> <br />
      <input type="date" name="dob" id="dob" required /> <br />
      <br />

      <!-- Terms & Conditions (checkbox required) -->
      <label for="terms&cond">Terms & Conditions</label> <br />
      <input
        type="checkbox"
        name="terms&cond"
        value="I agree to the Terms & Conditions"
      />I agree to the Terms & Conditions <br />

      <input
        type="checkbox"
        name="terms&cond"
        value="I accept the Terms & Conditions and Privacy Policy"
      />I accept the Terms & Conditions and Privacy Policy <br />

      <input
        type="checkbox"
        name="terms&cond"
        value="By signing up, you agree to our Terms & Conditions"
      />By signing up, you agree to our Terms & Conditions <br />
      <br />

      <!-- Sign Up button  -->
      <button type="submit">Sign Up Here</button>
    </form>
  </body>
</html>
