<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--Q1.. Create a Signup Form with:
Name
Email
Password
Gender (radio)
Hobbies (checkbox)
Country (dropdown)
Message (textarea)
Submit button -->

    <form action="#" method="POST">
      <!-- Name -->
      <label for="name">Name</label>
      <input type="text" />
      <br /><br />

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" />
      <br /><br />

      <!-- Password -->
      <label for="password">Password</label>
      <input type="password" />
      <br /><br />

      <!-- Gender (radio) -->
      <label for="Gender">Gender</label>
      <input type="radio" name="gender" />Male
      <input type="radio" name="gender" />Female <br /><br />

      <!-- Hobbies  -->
      <label for="hobbies">Hobbies</label>
      <input type="checkbox" />Book Reading <input type="checkbox" />Running

      <input type="checkbox" />Playing Guitar <br /><br />

      <!-- Country -->
      <label for="countries">Countries</label>
      <select name="count" id="101">
        <option value="india">India</option>
        <option value="usa">USA</option>
      </select>
      <br /><br />

      <!-- Message  -->
      <label for="message">Message</label>
      <textarea name="text" id="102"></textarea>
      <br /><br />

      <!-- Submit button  -->
      <label for="submit">Submit the form by clicking here</label>
      <button>Submit</button>
    </form>
  </body>
</html>
