<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>My Gallery</h1>

    <!-- basic image -->
    <img
      src="https://images.pexels.com/photos/35016102/pexels-photo-35016102.jpeg"
      alt="Capybara and Offspring in Natural Habitat"
      width="800"
    />

    <!-- lazy loading -->

    <img
      src="https://images.pexels.com/photos/36500885/pexels-photo-36500885.jpeg"
      alt="Traditional Life in Rize Highlands, Türkiye"
      loading="lazy"
      width="700"
    />

    <!-- figure -->
    <figure>
      <img
        src="https://images.pexels.com/photos/33483502/pexels-photo-33483502.jpeg"
        alt="Aerial View of Scenic Pyrenees Landscape in France"
        width="800"
      />
      <figcaption>Nature Image</figcaption>
    </figure>

    <!-- responsive -->
    <picture>
      <source
        media="(max-width:600px)"
        srcset="
          https://images.pexels.com/photos/36479414/pexels-photo-36479414.jpeg
        "
      />

      <img
        src="https://images.pexels.com/photos/36511070/pexels-photo-36511070.jpeg"
        alt="responsive img"
      />
    </picture>
  </body>
</html>
