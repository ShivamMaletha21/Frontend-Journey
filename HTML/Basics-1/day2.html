<!-- learning basic structure -->

<!doctype html>
<!-- this tells the browser that this document is using HTML5 -->
<html lang="eng">
  <!-- this is the root element of the webpage. lang = "eng"... it tells the browser and search engines that the language is english -->

  <head>
    <!-- contains information about the web page which is not visible to users... -->

    <meta charset="UTF-8" />
    <!-- it defines character encoding.. utf-8 supports almost all characters (English,Hindi,symbols,emojis) -->

    <meta name="viewport" content="width=device-width, initial-scale1.0" />

    <!-- it makes the website responsive on all devices..
    width=device-width ->matches screen width
    initital-scale=1.0 ->normal zoom level -->

    <title>MY First Website</title>
    <!-- title of the page.. appears in browser tab and search enigine results.. -->

    <link rel="stylesheet" href="style1.css" />
    <!-- it links external css file.. controls desgin color, layout,fonts -->
    <link rel="icon" href="favicon.ico" />
    <!-- add small icon in the browser tab -->
  </head>

  <body>
    <h1>Hello World</h1>
    <!-- main heading of the page -->
    <p>This is the website about logistics</p>
  </body>
</html>
<!-- this is closing tag.. everything inside represent one complete webpage -->
