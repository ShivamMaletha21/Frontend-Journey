<!-- LEVEL 1: Basic Real-World Forms
1. Student Registration Form
Like school admission form
Requirements:
Full Name (text, required)
Email (email, required)
Password (password)
Age (number)
Date of Birth (date)
Gender (radio)
Hobbies (checkbox)
Upload Photo (file)
Submit button
Concept Covered:
all input types
required validatio -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#" method="post">
      <!-- Full Name -->
      <label for="name">Full Name</label>
      <input type="text" name="name" />
      <br />
      <br />

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" name="email" />
      <br />
      <br />

      <!-- Password -->
      <label for="password">Password</label>
      <input type="password" name="password" />
      <br />
      <br />

      <!-- age -->
      <label for="age">Age</label>
      <input type="number" name="age" />
      <br />
      <br />

      <!-- date of birth -->
      <label for="dob">Date of Birth</label>
      <input type="date" name="dob" />
      <br />
      <br />

      <!-- gender -->
      <label for="gender">Gender</label>
      <input type="radio" name="gender" />Male
      <input type="radio" name="gender" />Female <br /><br />

      <!-- Hobbies -->
      <label for="hobbies">Hobbies</label>
      <input type="checkbox" name="hobbies" />Running
      <input type="checkbox" name="hobbies" />Studying
      <input type="checkbox" name="hobbies" />playing guitar <br /><br />

      <!-- Upload Photo -->
      <label for="upload">Upload Photo</label>
      <input type="file" accept=".jpg,.jpeg,.png" />
      <br /><br />

      <!-- Submit button -->
      <label for="Submit button"></label>
      <button name="Submit button">Submit</button>
    </form>
  </body>
</html>
