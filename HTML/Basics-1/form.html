<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="Post">
      <!-- text value -->
      <input type="text" value="click here" />
      <br /><br />
      <!-- password -->
      <input type="password" />
      <br /><br />
      <!-- email -->
      <input type="email" />

      <br /><br />
      <!-- number -->
      <input type="number" />

      <br /><br />
      <!-- date -->
      <input type="date" />

      <br /><br />
      <!-- upload file -->
      <input type="file" />
      <br /><br />

      <!-- radio (Single Choice) -->
      <!-- Only ONE option can be selected -->
      <input type="radio" name="gender" />Male
      <input type="radio" name="gender" />Female

      <br /><br />
      <!-- checkbox (Multiple Choice) -->

      <input type="checkbox" />Cricket <input type="checkbox" />Music
      <br /><br />

      <!-- submit.. sends data to server -->
      <input type="submit" />
      <br /><br />

      <!-- Form Elements -->

      <!-- <label> -->
      <label>Name:</label>
      <input type="text" />
      <br /><br />

      <!-- textarea -->
      <textarea name="textarea" id="434"></textarea>
      <br /><br />

      <!-- <select> and <option></option>... Used to create dropdown lists -->

      <select name="values" id="101">
        <option value="India">India</option>
        <option value="USA">USA</option>
      </select>
      <br /><br />

      <!-- button -->
      <button>Submit</button>
      <br /><br />

      <!-- Validation -->
      <input type="text" required />
    </form>
  </body>
</html>
