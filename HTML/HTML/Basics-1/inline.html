<!-- Question 1 (Basic Inline Usage) Create a paragraph: This is very important text.
Task: Emphasize “very” correctly (semantic way) Make “important” bold (semantic
way) -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>This is <em>very</em> <strong>important</strong> text</p>

    <!-- non-semantic -->
    <p>Please <i>do not</i> share your password. It is <b>confidential</b>.</p>
    <!-- <i> and <b> only change appearance
    No meaning for browser or screen readers -->

    <!-- semantic -->
    <p>
      Please <em>do not</em> share your password. It is
      <strong>confidential</strong>.
    </p>
    <!-- <em> → adds emphasis (important warning tone)
     <strong> → marks something as important -->

    <a href="https://google.com" target="_blank">open google</a>
  </body>
</html>
