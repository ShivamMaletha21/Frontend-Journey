<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- slides section -->
    <section class="slides">
      <div class="hero-slides">
        <!-- SLIDE 1 -->
        <div class="slide1">
          <div class="slide-box">
            <div class="content">
              <h1>Upgrade Your Style This Season</h1>
              <p>Discover premium fashion essentials for everyday wear.</p>
              <div class="buttons">
                <button>Shop Now</button>
                <button>View Collection</button>
              </div>
            </div>

            <div class="images">
              <img src="images/slide1.jpg" alt="img1" />
            </div>
          </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide1">
          <div class="slide-box">
            <div class="content">
              <h1>Step Into Comfort & Style</h1>
              <p>Explore sneaker collection for daily comfort.</p>
              <div class="buttons">
                <button>Explore</button>
                <button>Best Sellers</button>
              </div>
            </div>

            <div class="images">
              <img src="images/slide2.jpg" alt="img2" />
            </div>
          </div>
        </div>

        <!-- SLIDE 3 -->
        <div class="slide1">
          <div class="slide-box">
            <div class="content">
              <h1>Accessories Lifestyle</h1>
              <p>Smart gadgets that blend style and performance.</p>
              <div class="buttons">
                <button>Shop Now</button>
                <button>Learn More</button>
              </div>
            </div>

            <div class="images">
              <img src="images/slide3.jpg" alt="img3" />
            </div>
          </div>
        </div>
      </div>

      <!-- DOTS -->
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- ARROWS -->
      <div class="arrows">
        <span>&#10094;</span>
        <span>&#10095;</span>
      </div>
    </section>
  </body>
</html>
