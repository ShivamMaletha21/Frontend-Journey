<!-- 4. Feedback Form
Like after using an app
Requirements:
Name (optional)
Email
Rating (radio: 1–5)
Feedback (textarea)
“Would you recommend?” (radio Yes/No)
Submit button -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#" method="post">
      name
      <label for="name"> Full Name</label>
      <br />
      <input
        type="text"
        id="name"
        name="name"
        placeholder="enter your name"
        required
      />
      <br />
      <br />

      <!-- Email -->
      <label for="email">Email</label>
      <br />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="enter your email"
        required
      />
      <br /><br />

      <!-- Rating (radio: 1–5) -->
      <label>Rating:</label>
      <br />
      <input type="radio" name="rating" value="1" required />1
      <input type="radio" name="rating" value="2" />2
      <input type="radio" name="rating" value="3" />3
      <input type="radio" name="rating" value="4" />4
      <input type="radio" name="rating" value="5" />5 <br /><br />

      <!-- Feedback (textarea) -->
      <label for="feed">Feedback</label>
      <br />
      <textarea
        name="feed"
        id="feed"
        placeholder="Enter your Feedback"
        required
      ></textarea>
      <br />

      <!-- “Would you recommend?” (radio Yes/No) -->
      <label>Would you recommend</label>
      <br />
      <input type="radio" name="radio" value="Yes" /> Yes
      <input type="radio" name="radio" value="No" />No <br /><br />

      <!-- Submit button -->
      <button type="submit">Click to submit Form</button>
    </form>
  </body>
</html>
