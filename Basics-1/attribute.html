<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Types of Attributes -->
    <!-- Global Attributes
     Important Global Attributes -->

    <!-- 1. id -->
    <h1 id="title">Hello</h1>

    <!-- 2. class -->
    <p class="text">Paragraph 1</p>
    <p class="text">Paragraph 2</p>

    <!-- 3. title Provides additional information shown as a tooltip when hovering -->
    <p title="This is info">Hover me</p>

    <!-- 4. style -->
    <p style="color: red">Text</p>

    <p>This is a <strong>very important</strong> paragraph</p>

    <p>This is <b>bold</b> and <i>italic</i>text</p>

    <p>Water formula: H <sub>2</sub>0</p>
    <p>Math: x <sup>2</sup></p>
    <p><small>Terms and condition apply</small></p>
    <hr />
    <p><del>$500</del> <ins>$300</ins></p>
  </body>
</html>
