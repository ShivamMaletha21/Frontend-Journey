<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1528"/>
      <stop offset="100%" stop-color="#0E0B1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p2-grad)"/>
  <rect x="30" y="30" width="740" height="440" rx="14" fill="#151222" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="50" rx="14" fill="#1C182E"/>
  <circle cx="65" cy="55" r="7" fill="#FF5F56"/>
  <circle cx="88" cy="55" r="7" fill="#FFBD2E"/>
  <circle cx="111" cy="55" r="7" fill="#27C93F"/>
  <text x="150" y="60" fill="#A29CB5" font-family="monospace" font-size="13">synapse.ai/workspace/project-apollo</text>

  <!-- Node canvas visualization -->
  <g transform="translate(60, 105)">
    <!-- Canvas grid dots -->
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <rect width="680" height="340" rx="10" fill="#13101E"/>
    <rect width="680" height="340" rx="10" fill="url(#grid-dots)"/>

    <!-- Agent Node 1 -->
    <rect x="40" y="50" width="170" height="100" rx="10" fill="#211C33" stroke="#FF5722" stroke-width="2"/>
    <text x="55" y="80" fill="#FF7043" font-family="system-ui" font-size="13" font-weight="700">Researcher Agent</text>
    <text x="55" y="105" fill="#A29CB5" font-family="monospace" font-size="11">Extracting sources...</text>
    <rect x="55" y="120" width="140" height="6" rx="3" fill="#362E52"/>
    <rect x="55" y="120" width="105" height="6" rx="3" fill="#FF5722"/>

    <!-- Connector lines -->
    <path d="M 210 100 C 260 100, 260 180, 310 180" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Synthesizer Node 2 -->
    <rect x="310" y="130" width="180" height="110" rx="10" fill="#211C33" stroke="#7C4DFF" stroke-width="2"/>
    <text x="325" y="160" fill="#B388FF" font-family="system-ui" font-size="13" font-weight="700">Code Synthesis LLM</text>
    <text x="325" y="185" fill="#A29CB5" font-family="monospace" font-size="11">AST Generation &amp; Test</text>
    <rect x="325" y="205" width="150" height="22" rx="6" fill="#2E2648"/>
    <text x="338" y="220" fill="#00E676" font-family="monospace" font-size="10">✓ 42 unit tests passed</text>

    <!-- Connector lines -->
    <path d="M 490 180 C 530 180, 530 100, 570 100" fill="none" stroke="#7C4DFF" stroke-width="2"/>

    <!-- Deployer Node 3 -->
    <rect x="520" y="50" width="140" height="90" rx="10" fill="#211C33" stroke="#00E676" stroke-width="2"/>
    <text x="535" y="80" fill="#69F0AE" font-family="system-ui" font-size="13" font-weight="700">Auto Deploy</text>
    <text x="535" y="105" fill="#A29CB5" font-family="monospace" font-size="11">Cloud Run v1.4</text>
  </g>
</svg>
