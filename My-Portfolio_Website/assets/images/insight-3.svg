<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="in3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#in3-bg)"/>

  <!-- Sleek generative wave / ribbon -->
  <g transform="translate(300, 200)">
    <path d="M -180 80 C -80 -90, 80 90, 180 -80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
    <path d="M -180 50 C -80 -120, 80 60, 180 -110" fill="none" stroke="#FF5722" stroke-width="3.5"/>
    <path d="M -180 20 C -80 -150, 80 30, 180 -140" fill="none" stroke="rgba(255,87,34,0.4)" stroke-width="2"/>
    <circle cx="0" cy="-30" r="14" fill="#FF5722"/>
    <circle cx="0" cy="-30" r="22" fill="none" stroke="#FF5722" stroke-dasharray="4 4"/>
  </g>

  <!-- Tag Pill -->
  <rect x="35" y="35" width="135" height="28" rx="14" fill="#FF5722"/>
  <text x="50" y="53" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">AI ENGINEERING</text>
  <text x="470" y="53" fill="#777777" font-family="monospace" font-size="12">5 MIN READ</text>
</svg>
