<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="in2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#in2-bg)"/>

  <!-- Minimalist isometric monolith / cube composition -->
  <g transform="translate(300, 210)">
    <!-- Isometric cubes stack -->
    <!-- Cube 1 -->
    <polygon points="0,-90 60,-55 0,-20 -60,-55" fill="#3D3D48"/>
    <polygon points="0,-20 60,-55 60,15 0,50" fill="#25252E"/>
    <polygon points="0,-20 -60,-55 -60,15 0,50" fill="#1C1C24"/>

    <!-- Accent floating cube -->
    <g transform="translate(0, -60)">
      <polygon points="0,-50 40,-27 0,-4 -40,-27" fill="#FF5722"/>
      <polygon points="0,-4 40,-27 40,15 0,38" fill="#E64A19"/>
      <polygon points="0,-4 -40,-27 -40,15 0,38" fill="#BF360C"/>
    </g>

    <!-- Wireframe grid base -->
    <ellipse cx="0" cy="90" rx="140" ry="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Tag Pill -->
  <rect x="35" y="35" width="120" height="28" rx="14" fill="#FF5722"/>
  <text x="50" y="53" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">ARCHITECTURE</text>
  <text x="470" y="53" fill="#777777" font-family="monospace" font-size="12">8 MIN READ</text>
</svg>
