<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="in1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#in1-bg)"/>
  
  <!-- Sleek 3D geometric abstract mesh (inspired by the reference aesthetic) -->
  <g transform="translate(300, 200)">
    <!-- Concentric polygons / faceted geometric ribbons -->
    <polygon points="0,-130 110,-60 110,60 0,130 -110,60 -110,-60" fill="none" stroke="rgba(255,87,34,0.3)" stroke-width="2"/>
    <polygon points="0,-100 85,-45 85,45 0,100 -85,45 -85,-45" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <polygon points="0,-70 60,-30 60,30 0,70 -60,30 -60,-30" fill="none" stroke="#FF5722" stroke-width="2"/>
    
    <!-- Facet planes -->
    <polygon points="0,-70 60,-30 0,0" fill="url(#orb)" opacity="0.85"/>
    <polygon points="60,-30 60,30 0,0" fill="#222" opacity="0.9"/>
    <polygon points="60,30 0,70 0,0" fill="#E64A19" opacity="0.8"/>
    <polygon points="0,70 -60,30 0,0" fill="#111" opacity="0.95"/>
    <polygon points="-60,30 -60,-30 0,0" fill="#D84315" opacity="0.75"/>
    <polygon points="-60,-30 0,-70 0,0" fill="#333" opacity="0.9"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Tag Pill -->
  <rect x="35" y="35" width="130" height="28" rx="14" fill="#FF5722"/>
  <text x="50" y="53" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">PERFORMANCE</text>
  <text x="470" y="53" fill="#777777" font-family="monospace" font-size="12">6 MIN READ</text>
</svg>
