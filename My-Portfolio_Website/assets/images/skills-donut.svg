<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Radiant Gradients -->
    <linearGradient id="grad-sunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <linearGradient id="grad-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="donut-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6B00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circular track -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#ECE8DF" stroke-width="28"/>

  <!-- Segment 1: Frontend & UI (Sunset Gradient - 40%) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#grad-sunset)" stroke-width="28"
          stroke-dasharray="351 880" stroke-dashoffset="0" stroke-linecap="round" filter="url(#donut-glow)"
          transform="rotate(-90 200 200)"/>

  <!-- Segment 2: AI & Python (Lime Gradient - 25%) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#grad-lime)" stroke-width="28"
          stroke-dasharray="220 880" stroke-dashoffset="-380" stroke-linecap="round"
          transform="rotate(-90 200 200)"/>

  <!-- Segment 3: Full Stack Exploration (Cyan/Purple - 20%) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#grad-cyan)" stroke-width="28"
          stroke-dasharray="176 880" stroke-dashoffset="-630" stroke-linecap="round"
          transform="rotate(-90 200 200)"/>

  <!-- Center Text -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <text x="200" y="185" fill="#8C8C9A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">CORE SKILLSET</text>
    <text x="200" y="222" fill="#121214" font-size="28" font-weight="800">100%</text>
    <text x="200" y="245" fill="#575762" font-size="13" font-weight="600">Continuous Growth</text>
  </g>
</svg>
